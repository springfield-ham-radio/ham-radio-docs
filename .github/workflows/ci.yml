name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn playwright install chromium
      - name: Browser smoke over the built site
        run: |
          yarn preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/ham-radio-docs/; then
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/ham-radio-docs/
          yarn test:pages http://127.0.0.1:4173/ham-radio-docs
